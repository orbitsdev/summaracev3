plugins { id 'com.android.application' }

// Local test signing only: reads ../test-signing.properties (gitignored, never committed)
def testSigningFile = rootProject.file('test-signing.properties')
def testSigning = new Properties()
if (testSigningFile.exists()) { testSigningFile.withInputStream { testSigning.load(it) } }

android {
    namespace 'com.summarace.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.summarace.app.test'
        minSdk 24
        targetSdk 35
        versionCode 17
        versionName '1.3.6-test'
    }
    signingConfigs {
        if (testSigningFile.exists()) {
            testOnly {
                storeFile file(testSigning['storeFile'])
                storePassword testSigning['storePassword']
                keyAlias testSigning['keyAlias']
                keyPassword testSigning['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (testSigningFile.exists()) { signingConfig signingConfigs.testOnly }
        }
    }
    // keep compressed assets readable by the WebView
    androidResources { noCompress += ['mp3', 'woff2'] }
}
